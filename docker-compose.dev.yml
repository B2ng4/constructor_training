# Локальная разработка: проброс PostgreSQL и Redis на хост
# Запуск: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db redis
# Локальный S3 (MinIO): docker compose -f docker-compose.dev.yml up -d minio
#   S3_ENDPOINT_URL=http://localhost:9000, AWS_ACCESS_KEY_ID/SECRET=minioadmin
#   Консоль: http://localhost:9001
#   После создания бакета дать публичное чтение (иначе картинки 403):
#   docker exec <minio-container> mc anonymous set download local/trainings-dev
#   (или один раз: mc alias set local http://localhost:9000 minioadmin minioadmin)

services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  minio_data:
