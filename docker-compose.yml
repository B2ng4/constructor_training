services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./backend/.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.aicsis.ru}
    container_name: frontend
    expose:
      - "80"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend
    expose:
      - "8001"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      HOST: 0.0.0.0
      MINIO_ENDPOINT_URL: https://s3.aicsis.ru
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import os,urllib.request; urllib.request.urlopen(''http://127.0.0.1:''+os.environ.get(''PORT'',''8001'')+''/'', timeout=5)"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  db:
    image: postgres:15
    container_name: db
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/bash
      - -c
      - |
        export POSTGRES_USER="$${DB_USER:-postgres}"
        export POSTGRES_PASSWORD="$${DB_PASS:-admin}"
        export POSTGRES_DB="$${DB_NAME:-timofeymac}"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${DB_USER:-postgres}" -d "$${DB_NAME:-timofeymac}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  minio:
    image: dockerhub.timeweb.cloud/minio/minio:RELEASE.2024-11-07T00-52-19Z
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - ./backend/.env
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  minio-init:
    image: dockerhub.timeweb.cloud/minio/mc:RELEASE.2024-11-05T11-25-42Z
    container_name: minio-init
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 3; done
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set download "local/$${MINIO_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: celery_worker
    env_file:
      - ./backend/.env
    entrypoint: ["celery"]
    command: >
      -A core.celery_app worker
      --loglevel=info
      --concurrency=1
      --hostname=worker@%h
      -B
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT_URL: https://s3.aicsis.ru
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
