services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8001
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8001/'', timeout=5)"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  db:
    image: postgres:15
    container_name: db
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/bash
      - -c
      - |
        export POSTGRES_USER="$${DB_USER:-postgres}"
        export POSTGRES_PASSWORD="$${DB_PASS:-admin}"
        export POSTGRES_DB="$${DB_NAME:-timofeymac}"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${DB_USER:-postgres}" -d "$${DB_NAME:-timofeymac}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: celery_worker
    env_file:
      - ./backend/.env
    entrypoint: ["celery"]
    command: >
      -A core.celery_app worker
      --loglevel=info
      --concurrency=1
      --hostname=worker@%h
      -B
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
